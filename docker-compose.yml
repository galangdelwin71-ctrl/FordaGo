services:
  # ─── 1. Backend Laravel API (PHP 8.4) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fordago_backend
    restart: unless-stopped
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      PHP_CLI_SERVER_WORKERS: 8
      DB_HOST: 172.24.16.1
      DB_PORT: 3306
      DB_DATABASE: fordago
      DB_USERNAME: root
      DB_PASSWORD: ""
      RUN_MIGRATIONS: "false"
      REVERB_HOST: reverb
      REVERB_SERVER_HOST: reverb
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./backend/storage:/var/www/html/storage
      - ./backend/public:/var/www/html/public
    networks:
      - fordago_net

  # ─── 2. Reverb WebSocket Server ───────────────────────────────────────────
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fordago_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: 172.24.16.1
      DB_PORT: 3306
      DB_DATABASE: fordago
      DB_USERNAME: root
      DB_PASSWORD: ""
      RUN_MIGRATIONS: "false"
      REVERB_HOST: 0.0.0.0
      REVERB_SERVER_HOST: 0.0.0.0
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - backend
    networks:
      - fordago_net

  # ─── 3. Laravel Queue Worker ──────────────────────────────────────────────
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fordago_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: 172.24.16.1
      DB_PORT: 3306
      DB_DATABASE: fordago
      DB_USERNAME: root
      DB_PASSWORD: ""
      RUN_MIGRATIONS: "false"
      REVERB_HOST: reverb
      REVERB_SERVER_HOST: reverb
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - backend
    networks:
      - fordago_net

networks:
  fordago_net:
    driver: bridge
