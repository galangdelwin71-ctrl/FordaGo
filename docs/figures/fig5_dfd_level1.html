<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Flow Diagram Level 1 (DFD Level 1) of FordaGO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    font-family: 'Times New Roman', Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    width: 1540px;
    height: 2040px;
    margin: 0 auto;
  }
  .diagram-container {
    width: 1500px;
    height: 2000px;
    border: 4px solid #000000;
    background: #ffffff;
    padding: 10px;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Entity Boxes */
  .entity-box {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 4;
  }
  .entity-title {
    font-family: 'Times New Roman', Times, serif;
    font-size: 24px;
    font-weight: 900;
    text-anchor: middle;
    fill: #000000;
    letter-spacing: 0.5px;
  }
  /* Process Boxes */
  .process-box {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 3.5;
  }
  .process-header-line {
    stroke: #000000;
    stroke-width: 3;
  }
  .process-num {
    font-family: 'Times New Roman', Times, serif;
    font-size: 26px;
    font-weight: 900;
    text-anchor: middle;
    fill: #000000;
  }
  .process-name {
    font-family: 'Times New Roman', Times, serif;
    font-size: 21px;
    font-weight: 800;
    text-anchor: middle;
    fill: #000000;
  }
  /* Data Store */
  .store-line {
    stroke: #000000;
    stroke-width: 3.5;
    fill: none;
  }
  .store-fill {
    fill: #ffffff;
    stroke: none;
  }
  .store-id {
    font-family: 'Times New Roman', Times, serif;
    font-size: 25px;
    font-weight: 900;
    text-anchor: middle;
    dominant-baseline: central;
    fill: #000000;
  }
  .store-name {
    font-family: 'Times New Roman', Times, serif;
    font-size: 20px;
    font-weight: 800;
    dominant-baseline: central;
    fill: #000000;
  }
  /* Flow Lines */
  .flow-line {
    stroke: #000000;
    stroke-width: 2.8;
    fill: none;
    marker-end: url(#arrow);
  }
  .flow-text {
    font-family: 'Times New Roman', Times, serif;
    font-size: 15px;
    font-weight: 800;
    fill: #000000;
    paint-order: stroke fill;
    stroke: #ffffff;
    stroke-width: 5px;
    stroke-linejoin: round;
  }
</style>
</head>
<body>

<div class="diagram-container">
<svg viewBox="0 0 1480 1960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ================= EXTERNAL ENTITIES (LEFT COLUMN, x=25..220, w=195) ================= -->
  
  <!-- Entity 1: Gym Member (x=25, y=45, w=195, h=450) -->
  <rect x="25" y="45" width="195" height="450" class="entity-box" />
  <text x="122" y="260" class="entity-title">GYM</text>
  <text x="122" y="295" class="entity-title">MEMBER</text>

  <!-- Entity 2: Gym Coach (x=25, y=850, w=195, h=250) -->
  <rect x="25" y="850" width="195" height="250" class="entity-box" />
  <text x="122" y="970" class="entity-title">GYM</text>
  <text x="122" y="1005" class="entity-title">COACH</text>

  <!-- Entity 3: Gym Admin / Staff (x=25, y=1380, w=195, h=480) -->
  <rect x="25" y="1380" width="195" height="480" class="entity-box" />
  <text x="122" y="1610" class="entity-title">GYM ADMIN /</text>
  <text x="122" y="1645" class="entity-title">STAFF</text>

  <!-- ================= PROCESSES (CENTER COLUMN, x=560..960, w=400, h=130) ================= -->

  <!-- Process 1.0 -->
  <g id="p1">
    <rect x="560" y="45" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="83" x2="960" y2="83" class="process-header-line" />
    <text x="760" y="73" class="process-num">1.0</text>
    <text x="760" y="117" class="process-name">User Authentication</text>
    <text x="760" y="147" class="process-name">&amp; Profile Management</text>
  </g>

  <!-- Process 2.0 -->
  <g id="p2">
    <rect x="560" y="315" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="353" x2="960" y2="353" class="process-header-line" />
    <text x="760" y="343" class="process-num">2.0</text>
    <text x="760" y="387" class="process-name">QR Attendance Verification</text>
    <text x="760" y="417" class="process-name">&amp; Check-In Processing</text>
  </g>

  <!-- Process 3.0 -->
  <g id="p3">
    <rect x="560" y="585" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="623" x2="960" y2="623" class="process-header-line" />
    <text x="760" y="613" class="process-num">3.0</text>
    <text x="760" y="657" class="process-name">Equipment Optical QR Scanning</text>
    <text x="760" y="687" class="process-name">&amp; Instructional Guidance</text>
  </g>

  <!-- Process 4.0 -->
  <g id="p4">
    <rect x="560" y="855" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="893" x2="960" y2="893" class="process-header-line" />
    <text x="760" y="883" class="process-num">4.0</text>
    <text x="760" y="927" class="process-name">Workout Split Routine</text>
    <text x="760" y="957" class="process-name">&amp; PR Metric Logging</text>
  </g>

  <!-- Process 5.0 -->
  <g id="p5">
    <rect x="560" y="1125" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="1163" x2="960" y2="1163" class="process-header-line" />
    <text x="760" y="1153" class="process-num">5.0</text>
    <text x="760" y="1197" class="process-name">Real-Time Consultation &amp;</text>
    <text x="760" y="1227" class="process-name">Workout Plan Proposals</text>
  </g>

  <!-- Process 6.0 -->
  <g id="p6">
    <rect x="560" y="1395" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="1433" x2="960" y2="1433" class="process-header-line" />
    <text x="760" y="1423" class="process-num">6.0</text>
    <text x="760" y="1467" class="process-name">Supplement Shop POS</text>
    <text x="760" y="1497" class="process-name">&amp; Order Processing</text>
  </g>

  <!-- Process 7.0 -->
  <g id="p7">
    <rect x="560" y="1665" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="1703" x2="960" y2="1703" class="process-header-line" />
    <text x="760" y="1693" class="process-num">7.0</text>
    <text x="760" y="1737" class="process-name">Inventory Stock Management</text>
    <text x="760" y="1767" class="process-name">&amp; Dynamic Report Generation</text>
  </g>

  <!-- ================= DATA STORES (RIGHT COLUMN, x=1240..1465, w=225, h=85) ================= -->

  <!-- D1: users -->
  <g id="d1">
    <rect x="1240" y="70" width="225" height="85" class="store-fill" />
    <path d="M 1465 70 L 1240 70 L 1240 155 L 1465 155" class="store-line" />
    <line x1="1295" y1="70" x2="1295" y2="155" stroke="#000000" stroke-width="3" />
    <text x="1267" y="113" class="store-id">D1</text>
    <text x="1308" y="113" class="store-name">users</text>
  </g>

  <!-- D2: attendance -->
  <g id="d2">
    <rect x="1240" y="340" width="225" height="85" class="store-fill" />
    <path d="M 1465 340 L 1240 340 L 1240 425 L 1465 425" class="store-line" />
    <line x1="1295" y1="340" x2="1295" y2="425" stroke="#000000" stroke-width="3" />
    <text x="1267" y="383" class="store-id">D2</text>
    <text x="1308" y="383" class="store-name">attendance</text>
  </g>

  <!-- D3: equipment -->
  <g id="d3">
    <rect x="1240" y="610" width="225" height="85" class="store-fill" />
    <path d="M 1465 610 L 1240 610 L 1240 695 L 1465 695" class="store-line" />
    <line x1="1295" y1="610" x2="1295" y2="695" stroke="#000000" stroke-width="3" />
    <text x="1267" y="653" class="store-id">D3</text>
    <text x="1308" y="653" class="store-name">equipment</text>
  </g>

  <!-- D4: workout_sessions -->
  <g id="d4">
    <rect x="1240" y="880" width="225" height="85" class="store-fill" />
    <path d="M 1465 880 L 1240 880 L 1240 965 L 1465 965" class="store-line" />
    <line x1="1295" y1="880" x2="1295" y2="965" stroke="#000000" stroke-width="3" />
    <text x="1267" y="923" class="store-id">D4</text>
    <text x="1308" y="923" class="store-name">workout_sessions</text>
  </g>

  <!-- D5: workout_proposals -->
  <g id="d5">
    <rect x="1240" y="1150" width="225" height="85" class="store-fill" />
    <path d="M 1465 1150 L 1240 1150 L 1240 1235 L 1465 1235" class="store-line" />
    <line x1="1295" y1="1150" x2="1295" y2="1235" stroke="#000000" stroke-width="3" />
    <text x="1267" y="1193" class="store-id">D5</text>
    <text x="1308" y="1193" class="store-name">workout_proposals</text>
  </g>

  <!-- D6: orders -->
  <g id="d6">
    <rect x="1240" y="1420" width="225" height="85" class="store-fill" />
    <path d="M 1465 1420 L 1240 1420 L 1240 1505 L 1465 1505" class="store-line" />
    <line x1="1295" y1="1420" x2="1295" y2="1505" stroke="#000000" stroke-width="3" />
    <text x="1267" y="1463" class="store-id">D6</text>
    <text x="1308" y="1463" class="store-name">orders</text>
  </g>

  <!-- D7: products -->
  <g id="d7">
    <rect x="1240" y="1690" width="225" height="85" class="store-fill" />
    <path d="M 1465 1690 L 1240 1690 L 1240 1775 L 1465 1775" class="store-line" />
    <line x1="1295" y1="1690" x2="1295" y2="1775" stroke="#000000" stroke-width="3" />
    <text x="1267" y="1733" class="store-id">D7</text>
    <text x="1308" y="1733" class="store-name">products</text>
  </g>

  <!-- ================= DATA FLOW LINES & LABELS ================= -->
  <!-- Dedicated Vertical Bus at x = 230..270. 
       Horizontal flow text placed at x = 285..540.
       Zero collisions guaranteed! -->

  <!-- --- 1.0 User Authentication --- -->
  <path d="M 220 105 L 550 105" class="flow-line" />
  <text x="285" y="95" class="flow-text">Login Credentials / Account Data</text>
  
  <path d="M 560 145 L 230 145" class="flow-line" />
  <text x="285" y="165" class="flow-text">Auth Token &amp; Member Profile Data</text>
  
  <line x1="960" y1="105" x2="1230" y2="105" class="flow-line" />
  <text x="980" y="95" class="flow-text">Verify Credentials</text>
  <line x1="1240" y1="140" x2="970" y2="140" class="flow-line" />
  <text x="980" y="160" class="flow-text">User Record &amp; Roles</text>

  <!-- --- 2.0 Attendance --- -->
  <path d="M 220 375 L 550 375" class="flow-line" />
  <text x="285" y="365" class="flow-text">Scan Gym Entrance QR Code</text>
  
  <path d="M 560 410 L 230 410" class="flow-line" />
  <text x="285" y="400" class="flow-text">Attendance Confirmation Notice</text>
  
  <!-- Admin/Staff -> 2.0 (Attendance Monitor) via bus at x=235 -->
  <path d="M 220 1420 L 235 1420 L 235 435 L 550 435" class="flow-line" />
  <text x="285" y="450" class="flow-text">Live Attendance Status</text>
  
  <line x1="960" y1="375" x2="1230" y2="375" class="flow-line" />
  <text x="980" y="365" class="flow-text">Write Check-In Timestamp</text>
  <line x1="1240" y1="410" x2="970" y2="410" class="flow-line" />
  <text x="980" y="430" class="flow-text">Validate Membership Validity</text>

  <!-- --- 3.0 Equipment Optical QR --- -->
  <!-- Member -> 3.0 via bus at x=245 -->
  <path d="M 220 200 L 245 200 L 245 645 L 550 645" class="flow-line" />
  <text x="285" y="635" class="flow-text">Scan Equipment Optical QR Code</text>
  
  <!-- 3.0 -> Member via bus at x=255 -->
  <path d="M 560 685 L 255 685 L 255 235 L 230 235" class="flow-line" />
  <text x="285" y="705" class="flow-text">Instructional Video &amp; Muscle Guide</text>
  
  <line x1="960" y1="645" x2="1230" y2="645" class="flow-line" />
  <text x="980" y="635" class="flow-text">Query Equipment Identifier</text>
  <line x1="1240" y1="680" x2="970" y2="680" class="flow-line" />
  <text x="980" y="700" class="flow-text">Exercise Video Link &amp; Safety Info</text>

  <!-- --- 4.0 Workout Split Routine & PR --- -->
  <!-- Member -> 4.0 via bus at x=265 -->
  <path d="M 220 170 L 265 170 L 265 915 L 550 915" class="flow-line" />
  <text x="285" y="905" class="flow-text">Log Exercise Sets, Reps &amp; Weights</text>
  
  <!-- 4.0 -> Member via bus at x=255 -->
  <path d="M 560 955 L 255 955 L 255 110 L 230 110" class="flow-line" />
  <text x="285" y="975" class="flow-text">Strength Progression &amp; PR Charts</text>
  
  <line x1="960" y1="915" x2="1230" y2="915" class="flow-line" />
  <text x="980" y="905" class="flow-text">Save Daily Sets, Reps &amp; Weights</text>
  <line x1="1240" y1="950" x2="970" y2="950" class="flow-line" />
  <text x="980" y="970" class="flow-text">Fetch Personal Record (PR) History</text>

  <!-- --- 5.0 Consultation & Workout Proposals --- -->
  <!-- Coach -> 5.0 via bus at x=240 -->
  <path d="M 220 980 L 240 980 L 240 1185 L 550 1185" class="flow-line" />
  <text x="285" y="1175" class="flow-text">Submit Tailored Workout Proposal</text>
  
  <!-- 5.0 -> Coach via bus at x=250 -->
  <path d="M 560 1225 L 250 1225 L 250 1040 L 230 1040" class="flow-line" />
  <text x="285" y="1245" class="flow-text">Plan Acceptance &amp; Consultation Chat</text>
  
  <line x1="960" y1="1185" x2="1230" y2="1185" class="flow-line" />
  <text x="980" y="1175" class="flow-text">Save Proposal &amp; Message</text>
  <line x1="1240" y1="1220" x2="970" y2="1220" class="flow-line" />
  <text x="980" y="1240" class="flow-text">Retrieve Consultation History</text>

  <!-- --- 6.0 Supplement Shop POS & Orders --- -->
  <!-- Member -> 6.0 (online order) via bus at x=235 -->
  <path d="M 220 460 L 235 460 L 235 1455 L 550 1455" class="flow-line" />
  <text x="285" y="1445" class="flow-text">Online Order &amp; Digital Payment</text>
  
  <!-- Staff -> 6.0 (counter POS) direct horizontal -->
  <path d="M 220 1495 L 550 1495" class="flow-line" />
  <text x="285" y="1485" class="flow-text">Counter POS Sale &amp; Cash Payment</text>
  
  <line x1="960" y1="1455" x2="1230" y2="1455" class="flow-line" />
  <text x="980" y="1445" class="flow-text">Write Order &amp; Payment Record</text>
  <line x1="1240" y1="1490" x2="970" y2="1490" class="flow-line" />
  <text x="980" y="1510" class="flow-text">Order Verification Status</text>
  
  <!-- 6.0 -> D7 (stock auto-deduct) -->
  <path d="M 960 1515 L 1020 1515 L 1020 1715 L 1230 1715" class="flow-line" />
  <text x="1035" y="1610" class="flow-text">Auto-Deduct Product Stock</text>

  <!-- --- 7.0 Inventory & Report Generation --- -->
  <line x1="220" y1="1725" x2="550" y2="1725" class="flow-line" />
  <text x="285" y="1715" class="flow-text">Stock Adjustments &amp; Report Parameters</text>
  
  <line x1="560" y1="1765" x2="230" y2="1765" class="flow-line" />
  <text x="285" y="1785" class="flow-text">Exported PDF &amp; Excel Analytics</text>
  
  <line x1="960" y1="1750" x2="1230" y2="1750" class="flow-line" />
  <text x="980" y="1740" class="flow-text">Update Product Catalog</text>
  <line x1="1240" y1="1785" x2="970" y2="1785" class="flow-line" />
  <text x="980" y="1805" class="flow-text">Query Stock Totals</text>

</svg>
</div>

</body>
</html>
