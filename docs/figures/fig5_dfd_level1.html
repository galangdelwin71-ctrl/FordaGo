<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figure 5. Data Flow Diagram Level 1 (DFD Level 1) of FordaGO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    font-family: 'Times New Roman', Times, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px 20px;
    width: 1500px;
    height: 1750px;
  }
  .title {
    font-size: 22px;
    font-weight: bold;
    font-style: italic;
    margin-top: 25px;
    color: #000000;
  }
  .diagram-container {
    position: relative;
    width: 1420px;
    height: 1600px;
  }
  svg {
    width: 100%;
    height: 100%;
  }
  /* Entity Boxes */
  .entity-box {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 2.5;
  }
  .entity-text {
    font-family: 'Times New Roman', Times, serif;
    font-size: 18px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: central;
    fill: #000000;
  }
  /* Process Boxes (Rounded with header line) */
  .process-box {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 2.2;
  }
  .process-header-line {
    stroke: #000000;
    stroke-width: 1.8;
  }
  .process-num {
    font-family: 'Times New Roman', Times, serif;
    font-size: 17px;
    font-weight: bold;
    text-anchor: middle;
    fill: #000000;
  }
  .process-name {
    font-family: 'Times New Roman', Times, serif;
    font-size: 15px;
    font-weight: bold;
    text-anchor: middle;
    fill: #000000;
  }
  /* Data Store (Open-ended box with label) */
  .store-line {
    stroke: #000000;
    stroke-width: 2.2;
    fill: none;
  }
  .store-fill {
    fill: #fbfbfb;
    stroke: none;
  }
  .store-text {
    font-family: 'Times New Roman', Times, serif;
    font-size: 16px;
    font-weight: bold;
    dominant-baseline: central;
    fill: #000000;
  }
  /* Flow Lines */
  .flow-line {
    stroke: #000000;
    stroke-width: 1.8;
    fill: none;
    marker-end: url(#arrow);
  }
  .flow-text {
    font-family: 'Times New Roman', Times, serif;
    font-size: 14px;
    font-weight: bold;
    fill: #000000;
  }
</style>
</head>
<body>

<div class="diagram-container">
<svg viewBox="0 0 1420 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ================= EXTERNAL ENTITIES (LEFT) ================= -->
  
  <!-- Entity: Member (x=60, y=280, w=150, h=160) -->
  <rect x="60" y="260" width="160" height="150" class="entity-box" />
  <text x="140" y="335" class="entity-text">Gym Member</text>

  <!-- Entity: Coach (x=60, y=740, w=150, h=140) -->
  <rect x="60" y="740" width="160" height="140" class="entity-box" />
  <text x="140" y="810" class="entity-text">Gym Coach</text>

  <!-- Entity: Admin / Staff (x=60, y=1260, w=160, h=140) -->
  <rect x="60" y="1260" width="160" height="140" class="entity-box" />
  <text x="140" y="1320" class="entity-text">Gym Admin /</text>
  <text x="140" y="1345" class="entity-text">Front-Desk Staff</text>

  <!-- ================= PROCESSES (CENTER, x=530, w=260, h=105) ================= -->

  <!-- Process 1.0: User Authentication & Profiles -->
  <g id="p1">
    <rect x="540" y="50" width="260" height="105" rx="16" class="process-box" />
    <line x1="540" y1="82" x2="800" y2="82" class="process-header-line" />
    <text x="670" y="72" class="process-num">1.0</text>
    <text x="670" y="110" class="process-name">User Authentication</text>
    <text x="670" y="130" class="process-name">&amp; Profile Management</text>
  </g>

  <!-- Process 2.0: QR Attendance & Check-In -->
  <g id="p2">
    <rect x="540" y="270" width="260" height="105" rx="16" class="process-box" />
    <line x1="540" y1="302" x2="800" y2="302" class="process-header-line" />
    <text x="670" y="292" class="process-num">2.0</text>
    <text x="670" y="330" class="process-name">QR Attendance Verification</text>
    <text x="670" y="350" class="process-name">&amp; Check-In Processing</text>
  </g>

  <!-- Process 3.0: Equipment QR Scanning -->
  <g id="p3">
    <rect x="540" y="490" width="260" height="105" rx="16" class="process-box" />
    <line x1="540" y1="522" x2="800" y2="522" class="process-header-line" />
    <text x="670" y="512" class="process-num">3.0</text>
    <text x="670" y="550" class="process-name">Optical Equipment QR Scanning</text>
    <text x="670" y="570" class="process-name">&amp; Instructional Guidance</text>
  </g>

  <!-- Process 4.0: Workout & PR Logging -->
  <g id="p4">
    <rect x="540" y="710" width="260" height="105" rx="16" class="process-box" />
    <line x1="540" y1="742" x2="800" y2="742" class="process-header-line" />
    <text x="670" y="732" class="process-num">4.0</text>
    <text x="670" y="770" class="process-name">Workout Split Routine</text>
    <text x="670" y="790" class="process-name">&amp; PR Metric Logging</text>
  </g>

  <!-- Process 5.0: Coaching & Workout Proposals -->
  <g id="p5">
    <rect x="540" y="930" width="260" height="105" rx="16" class="process-box" />
    <line x1="540" y1="962" x2="800" y2="962" class="process-header-line" />
    <text x="670" y="952" class="process-num">5.0</text>
    <text x="670" y="990" class="process-name">Real-Time Consultation &amp;</text>
    <text x="670" y="1010" class="process-name">Workout Plan Proposals</text>
  </g>

  <!-- Process 6.0: Shop POS & Order Processing -->
  <g id="p6">
    <rect x="540" y="1150" width="260" height="105" rx="16" class="process-box" />
    <line x1="540" y1="1182" x2="800" y2="1182" class="process-header-line" />
    <text x="670" y="1172" class="process-num">6.0</text>
    <text x="670" y="1210" class="process-name">Supplement Shop POS</text>
    <text x="670" y="1230" class="process-name">&amp; Order Processing</text>
  </g>

  <!-- Process 7.0: Inventory & Report Generation -->
  <g id="p7">
    <rect x="540" y="1370" width="260" height="105" rx="16" class="process-box" />
    <line x1="540" y1="1402" x2="800" y2="1402" class="process-header-line" />
    <text x="670" y="1392" class="process-num">7.0</text>
    <text x="670" y="1430" class="process-name">Inventory Stock Management</text>
    <text x="670" y="1450" class="process-name">&amp; Dynamic Report Generation</text>
  </g>

  <!-- ================= DATA STORES (RIGHT, x=1120, w=240, h=65) ================= -->
  <!-- Note: Data stores match exact MySQL & ERD tables: users, attendance, equipment, workout_sessions, workout_plan_proposals, orders, products -->

  <!-- Store 1: users -->
  <g id="d1">
    <rect x="1120" y="70" width="240" height="65" class="store-fill" />
    <path d="M 1360 70 L 1120 70 L 1120 135 L 1360 135" class="store-line" />
    <line x1="1165" y1="70" x2="1165" y2="135" stroke="#000000" stroke-width="1.5" />
    <text x="1142" y="103" class="store-text" text-anchor="middle">D1</text>
    <text x="1185" y="103" class="store-text">users</text>
  </g>

  <!-- Store 2: attendance -->
  <g id="d2">
    <rect x="1120" y="290" width="240" height="65" class="store-fill" />
    <path d="M 1360 290 L 1120 290 L 1120 355 L 1360 355" class="store-line" />
    <line x1="1165" y1="290" x2="1165" y2="355" stroke="#000000" stroke-width="1.5" />
    <text x="1142" y="323" class="store-text" text-anchor="middle">D2</text>
    <text x="1185" y="323" class="store-text">attendance</text>
  </g>

  <!-- Store 3: equipment -->
  <g id="d3">
    <rect x="1120" y="510" width="240" height="65" class="store-fill" />
    <path d="M 1360 510 L 1120 510 L 1120 575 L 1360 575" class="store-line" />
    <line x1="1165" y1="510" x2="1165" y2="575" stroke="#000000" stroke-width="1.5" />
    <text x="1142" y="543" class="store-text" text-anchor="middle">D3</text>
    <text x="1185" y="543" class="store-text">equipment</text>
  </g>

  <!-- Store 4: workout_sessions -->
  <g id="d4">
    <rect x="1120" y="730" width="240" height="65" class="store-fill" />
    <path d="M 1360 730 L 1120 730 L 1120 795 L 1360 795" class="store-line" />
    <line x1="1165" y1="730" x2="1165" y2="795" stroke="#000000" stroke-width="1.5" />
    <text x="1142" y="763" class="store-text" text-anchor="middle">D4</text>
    <text x="1185" y="763" class="store-text">workout_sessions</text>
  </g>

  <!-- Store 5: workout_plan_proposals -->
  <g id="d5">
    <rect x="1120" y="950" width="240" height="65" class="store-fill" />
    <path d="M 1360 950 L 1120 950 L 1120 1015 L 1360 1015" class="store-line" />
    <line x1="1165" y1="950" x2="1165" y2="1015" stroke="#000000" stroke-width="1.5" />
    <text x="1142" y="983" class="store-text" text-anchor="middle">D5</text>
    <text x="1185" y="983" class="store-text">workout_proposals</text>
  </g>

  <!-- Store 6: orders -->
  <g id="d6">
    <rect x="1120" y="1170" width="240" height="65" class="store-fill" />
    <path d="M 1360 1170 L 1120 1170 L 1120 1235 L 1360 1235" class="store-line" />
    <line x1="1165" y1="1170" x2="1165" y2="1235" stroke="#000000" stroke-width="1.5" />
    <text x="1142" y="1203" class="store-text" text-anchor="middle">D6</text>
    <text x="1185" y="1203" class="store-text">orders</text>
  </g>

  <!-- Store 7: products -->
  <g id="d7">
    <rect x="1120" y="1390" width="240" height="65" class="store-fill" />
    <path d="M 1360 1390 L 1120 1390 L 1120 1455 L 1360 1455" class="store-line" />
    <line x1="1165" y1="1390" x2="1165" y2="1455" stroke="#000000" stroke-width="1.5" />
    <text x="1142" y="1423" class="store-text" text-anchor="middle">D7</text>
    <text x="1185" y="1423" class="store-text">products</text>
  </g>

  <!-- ================= DATA FLOW LINES & LABELS ================= -->

  <!-- --- 1.0 User Authentication --- -->
  <!-- Member -> 1.0 -->
  <path d="M 140 260 L 140 85 L 530 85" class="flow-line" />
  <text x="240" y="75" class="flow-text">Login Credentials / Registration Data</text>
  <!-- 1.0 -> Member -->
  <path d="M 540 120 L 180 120 L 180 260" class="flow-line" />
  <text x="250" y="135" class="flow-text">Session Token &amp; Profile Data</text>
  <!-- 1.0 <-> D1 (users) -->
  <line x1="800" y1="90" x2="1110" y2="90" class="flow-line" />
  <text x="890" y="82" class="flow-text">Verify Credentials</text>
  <line x1="1120" y1="115" x2="810" y2="115" class="flow-line" />
  <text x="910" y="132" class="flow-text">User Record</text>

  <!-- --- 2.0 Attendance --- -->
  <!-- Member -> 2.0 -->
  <line x1="220" y1="300" x2="530" y2="300" class="flow-line" />
  <text x="280" y="292" class="flow-text">Present Digital QR Pass</text>
  <!-- 2.0 -> Member -->
  <line x1="540" y1="330" x2="230" y2="330" class="flow-line" />
  <text x="290" y="348" class="flow-text">Attendance Confirmation</text>
  <!-- Admin -> 2.0 -->
  <path d="M 220 1280 L 460 1280 L 460 350 L 530 350" class="flow-line" />
  <text x="310" y="365" class="flow-text">Staff Scanner Verification</text>
  <!-- 2.0 <-> D2 (attendance) -->
  <line x1="800" y1="310" x2="1110" y2="310" class="flow-line" />
  <text x="880" y="302" class="flow-text">Write Check-In Timestamp</text>
  <line x1="1120" y1="335" x2="810" y2="335" class="flow-line" />
  <text x="900" y="352" class="flow-text">Validate Pass Status</text>

  <!-- --- 3.0 Equipment QR --- -->
  <!-- Member -> 3.0 -->
  <path d="M 200 410 L 200 520 L 530 520" class="flow-line" />
  <text x="280" y="512" class="flow-text">Scan Equipment Optical QR</text>
  <!-- 3.0 -> Member -->
  <path d="M 540 555 L 180 555 L 180 410" class="flow-line" />
  <text x="270" y="572" class="flow-text">Instructional Movement Tutorial</text>
  <!-- 3.0 <-> D3 (equipment) -->
  <line x1="800" y1="535" x2="1110" y2="535" class="flow-line" />
  <text x="890" y="527" class="flow-text">Query Equipment Placard</text>
  <line x1="1120" y1="560" x2="810" y2="560" class="flow-line" />
  <text x="910" y="577" class="flow-text">Exercise &amp; Muscle Guide</text>

  <!-- --- 4.0 Workout / PR Tracking --- -->
  <!-- Member -> 4.0 -->
  <path d="M 160 410 L 160 740 L 530 740" class="flow-line" />
  <text x="250" y="732" class="flow-text">Log Lifting PR &amp; Split Routine</text>
  <!-- 4.0 -> Member -->
  <path d="M 540 775 L 140 775 L 140 410" class="flow-line" />
  <text x="260" y="792" class="flow-text">Historical Strength Metrics</text>
  <!-- 4.0 <-> D4 (workout_sessions) -->
  <line x1="800" y1="745" x2="1110" y2="745" class="flow-line" />
  <text x="890" y="737" class="flow-text">Store Routine Split &amp; PRs</text>
  <line x1="1120" y1="770" x2="810" y2="770" class="flow-line" />
  <text x="910" y="787" class="flow-text">Fetch Trainee Progress</text>

  <!-- --- 5.0 Coaching & Proposals --- -->
  <!-- Coach -> 5.0 -->
  <path d="M 220 790 L 480 790 L 480 960 L 530 960" class="flow-line" />
  <text x="270" y="952" class="flow-text">Submit Workout Plan Proposal</text>
  <!-- 5.0 -> Coach -->
  <path d="M 540 985 L 500 985 L 500 820 L 230 820" class="flow-line" />
  <text x="270" y="812" class="flow-text">Proposal Acceptance Status</text>
  <!-- Member <-> 5.0 -->
  <path d="M 540 1015 L 120 1015 L 120 410" class="flow-line" />
  <text x="260" y="1032" class="flow-text">Accept/Decline Proposal &amp; Chat</text>
  <!-- 5.0 <-> D5 (workout_proposals) -->
  <line x1="800" y1="965" x2="1110" y2="965" class="flow-line" />
  <text x="880" y="957" class="flow-text">Save Proposal &amp; Chat Message</text>
  <line x1="1120" y1="990" x2="810" y2="990" class="flow-line" />
  <text x="900" y="1007" class="flow-text">Retrieve Active Proposals</text>

  <!-- --- 6.0 Shop POS & Orders --- -->
  <!-- Member -> 6.0 -->
  <path d="M 100 410 L 100 1180 L 530 1180" class="flow-line" />
  <text x="260" y="1172" class="flow-text">Cart Checkout &amp; GCash Proof</text>
  <!-- Admin -> 6.0 -->
  <path d="M 220 1310 L 500 1310 L 500 1220 L 530 1220" class="flow-line" />
  <text x="270" y="1240" class="flow-text">Counter POS Sale / Approval</text>
  <!-- 6.0 <-> D6 (orders) -->
  <line x1="800" y1="1185" x2="1110" y2="1185" class="flow-line" />
  <text x="890" y="1177" class="flow-text">Write Order &amp; Payment Record</text>
  <line x1="1120" y1="1210" x2="810" y2="1210" class="flow-line" />
  <text x="910" y="1227" class="flow-text">Order Approval Status</text>
  <!-- 6.0 -> D7 (products stock deduction) -->
  <path d="M 800 1235 L 1080 1235 L 1080 1410 L 1110 1410" class="flow-line" />
  <text x="850" y="1285" class="flow-text">Deduct Inventory Stock</text>

  <!-- --- 7.0 Inventory & Report Generation --- -->
  <!-- Admin -> 7.0 -->
  <line x1="220" y1="1390" x2="530" y2="1390" class="flow-line" />
  <text x="270" y="1382" class="flow-text">Product Updates / Report Filter</text>
  <!-- 7.0 -> Admin -->
  <line x1="540" y1="1435" x2="230" y2="1435" class="flow-line" />
  <text x="260" y="1452" class="flow-text">Vector PDF / Excel Reports</text>
  <!-- 7.0 <-> D7 (products) -->
  <line x1="800" y1="1430" x2="1110" y2="1430" class="flow-line" />
  <text x="890" y="1422" class="flow-text">Manage Supplement Catalog</text>
  <!-- 7.0 <- D1, D2, D6 (Data aggregation) -->
  <path d="M 1370 100 L 1400 100 L 1400 1465 L 810 1465" class="flow-line" />
  <text x="920" y="1485" class="flow-text">Aggregate Attendance &amp; Sales Data for Analytics</text>

</svg>
</div>

<div class="title">Figure 5. Data Flow Diagram Level 1 (DFD Level 1) of FordaGO</div>

</body>
</html>
