<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Flow Diagram Level 1 (DFD Level 1) of FordaGO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    font-family: 'Times New Roman', Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    width: 1540px;
    height: 2040px;
    margin: 0 auto;
  }
  .diagram-container {
    width: 1500px;
    height: 2000px;
    border: 4px solid #000000;
    background: #ffffff;
    padding: 10px;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Entity Boxes */
  .entity-box {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 4;
  }
  .entity-title {
    font-family: 'Times New Roman', Times, serif;
    font-size: 28px;
    font-weight: 900;
    text-anchor: middle;
    fill: #000000;
    letter-spacing: 0.5px;
  }
  /* Process Boxes */
  .process-box {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 3.5;
  }
  .process-header-line {
    stroke: #000000;
    stroke-width: 3;
  }
  .process-num {
    font-family: 'Times New Roman', Times, serif;
    font-size: 26px;
    font-weight: 900;
    text-anchor: middle;
    fill: #000000;
  }
  .process-name {
    font-family: 'Times New Roman', Times, serif;
    font-size: 21px;
    font-weight: 800;
    text-anchor: middle;
    fill: #000000;
  }
  /* Data Store */
  .store-line {
    stroke: #000000;
    stroke-width: 3.5;
    fill: none;
  }
  .store-fill {
    fill: #ffffff;
    stroke: none;
  }
  .store-id {
    font-family: 'Times New Roman', Times, serif;
    font-size: 26px;
    font-weight: 900;
    text-anchor: middle;
    dominant-baseline: central;
    fill: #000000;
  }
  .store-name {
    font-family: 'Times New Roman', Times, serif;
    font-size: 23px;
    font-weight: 800;
    dominant-baseline: central;
    fill: #000000;
  }
  /* Flow Lines */
  .flow-line {
    stroke: #000000;
    stroke-width: 2.8;
    fill: none;
    marker-end: url(#arrow);
  }
  .flow-text {
    font-family: 'Times New Roman', Times, serif;
    font-size: 15.5px;
    font-weight: 800;
    fill: #000000;
    paint-order: stroke fill;
    stroke: #ffffff;
    stroke-width: 5px;
    stroke-linejoin: round;
  }
</style>
</head>
<body>

<div class="diagram-container">
<svg viewBox="0 0 1480 1960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ================= EXTERNAL ENTITIES (LEFT COLUMN, x=30..205, w=175) ================= -->
  
  <!-- Entity 1: Gym Member (x=30, y=45, w=175, h=450) -->
  <rect x="30" y="45" width="175" height="450" class="entity-box" />
  <text x="117" y="260" class="entity-title">GYM</text>
  <text x="117" y="295" class="entity-title">MEMBER</text>

  <!-- Entity 2: Gym Coach (x=30, y=850, w=175, h=250) -->
  <rect x="30" y="850" width="175" height="250" class="entity-box" />
  <text x="117" y="970" class="entity-title">GYM</text>
  <text x="117" y="1005" class="entity-title">COACH</text>

  <!-- Entity 3: Gym Admin / Staff (x=30, y=1380, w=175, h=480) -->
  <rect x="30" y="1380" width="175" height="480" class="entity-box" />
  <text x="117" y="1610" class="entity-title">GYM ADMIN /</text>
  <text x="117" y="1645" class="entity-title">STAFF</text>

  <!-- ================= PROCESSES (CENTER COLUMN, x=560..960, w=400, h=130) ================= -->

  <!-- Process 1.0 -->
  <g id="p1">
    <rect x="560" y="45" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="83" x2="960" y2="83" class="process-header-line" />
    <text x="760" y="73" class="process-num">1.0</text>
    <text x="760" y="117" class="process-name">User Authentication</text>
    <text x="760" y="147" class="process-name">&amp; Profile Management</text>
  </g>

  <!-- Process 2.0 -->
  <g id="p2">
    <rect x="560" y="315" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="353" x2="960" y2="353" class="process-header-line" />
    <text x="760" y="343" class="process-num">2.0</text>
    <text x="760" y="387" class="process-name">QR Attendance Verification</text>
    <text x="760" y="417" class="process-name">&amp; Check-In Processing</text>
  </g>

  <!-- Process 3.0 -->
  <g id="p3">
    <rect x="560" y="585" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="623" x2="960" y2="623" class="process-header-line" />
    <text x="760" y="613" class="process-num">3.0</text>
    <text x="760" y="657" class="process-name">Equipment QR Code Scanning</text>
    <text x="760" y="687" class="process-name">&amp; Exercise Workout Guides</text>
  </g>

  <!-- Process 4.0 -->
  <g id="p4">
    <rect x="560" y="855" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="893" x2="960" y2="893" class="process-header-line" />
    <text x="760" y="883" class="process-num">4.0</text>
    <text x="760" y="927" class="process-name">Workout Split Routines</text>
    <text x="760" y="957" class="process-name">&amp; Personal Record (PR) Logs</text>
  </g>

  <!-- Process 5.0 -->
  <g id="p5">
    <rect x="560" y="1125" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="1163" x2="960" y2="1163" class="process-header-line" />
    <text x="760" y="1153" class="process-num">5.0</text>
    <text x="760" y="1197" class="process-name">Real-Time Consultation &amp;</text>
    <text x="760" y="1227" class="process-name">Workout Plan Proposals</text>
  </g>

  <!-- Process 6.0 -->
  <g id="p6">
    <rect x="560" y="1395" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="1433" x2="960" y2="1433" class="process-header-line" />
    <text x="760" y="1423" class="process-num">6.0</text>
    <text x="760" y="1467" class="process-name">Gym Store Sales</text>
    <text x="760" y="1497" class="process-name">&amp; Order Processing</text>
  </g>

  <!-- Process 7.0 -->
  <g id="p7">
    <rect x="560" y="1665" width="400" height="130" rx="16" class="process-box" />
    <line x1="560" y1="1703" x2="960" y2="1703" class="process-header-line" />
    <text x="760" y="1693" class="process-num">7.0</text>
    <text x="760" y="1737" class="process-name">Store Inventory Management</text>
    <text x="760" y="1767" class="process-name">&amp; System Report Generation</text>
  </g>

  <!-- ================= DATA STORES (RIGHT COLUMN, x=1240..1455, w=215, h=85) ================= -->

  <!-- D1: users -->
  <g id="d1">
    <rect x="1240" y="70" width="215" height="85" class="store-fill" />
    <path d="M 1455 70 L 1240 70 L 1240 155 L 1455 155" class="store-line" />
    <line x1="1295" y1="70" x2="1295" y2="155" stroke="#000000" stroke-width="3" />
    <text x="1267" y="113" class="store-id">D1</text>
    <text x="1312" y="113" class="store-name">users</text>
  </g>

  <!-- D2: attendance -->
  <g id="d2">
    <rect x="1240" y="340" width="215" height="85" class="store-fill" />
    <path d="M 1455 340 L 1240 340 L 1240 425 L 1455 425" class="store-line" />
    <line x1="1295" y1="340" x2="1295" y2="425" stroke="#000000" stroke-width="3" />
    <text x="1267" y="383" class="store-id">D2</text>
    <text x="1312" y="383" class="store-name">attendance</text>
  </g>

  <!-- D3: equipment -->
  <g id="d3">
    <rect x="1240" y="610" width="215" height="85" class="store-fill" />
    <path d="M 1455 610 L 1240 610 L 1240 695 L 1455 695" class="store-line" />
    <line x1="1295" y1="610" x2="1295" y2="695" stroke="#000000" stroke-width="3" />
    <text x="1267" y="653" class="store-id">D3</text>
    <text x="1312" y="653" class="store-name">equipment</text>
  </g>

  <!-- D4: workout_logs -->
  <g id="d4">
    <rect x="1240" y="880" width="215" height="85" class="store-fill" />
    <path d="M 1455 880 L 1240 880 L 1240 965 L 1455 965" class="store-line" />
    <line x1="1295" y1="880" x2="1295" y2="965" stroke="#000000" stroke-width="3" />
    <text x="1267" y="923" class="store-id">D4</text>
    <text x="1312" y="923" class="store-name">workout_logs</text>
  </g>

  <!-- D5: proposals_chat -->
  <g id="d5">
    <rect x="1240" y="1150" width="215" height="85" class="store-fill" />
    <path d="M 1455 1150 L 1240 1150 L 1240 1235 L 1455 1235" class="store-line" />
    <line x1="1295" y1="1150" x2="1295" y2="1235" stroke="#000000" stroke-width="3" />
    <text x="1267" y="1193" class="store-id">D5</text>
    <text x="1312" y="1193" class="store-name">proposals_chat</text>
  </g>

  <!-- D6: payments_orders -->
  <g id="d6">
    <rect x="1240" y="1420" width="215" height="85" class="store-fill" />
    <path d="M 1455 1420 L 1240 1420 L 1240 1505 L 1455 1505" class="store-line" />
    <line x1="1295" y1="1420" x2="1295" y2="1505" stroke="#000000" stroke-width="3" />
    <text x="1267" y="1463" class="store-id">D6</text>
    <text x="1312" y="1463" class="store-name">orders_sales</text>
  </g>

  <!-- D7: inventory -->
  <g id="d7">
    <rect x="1240" y="1690" width="215" height="85" class="store-fill" />
    <path d="M 1455 1690 L 1240 1690 L 1240 1775 L 1455 1775" class="store-line" />
    <line x1="1295" y1="1690" x2="1295" y2="1775" stroke="#000000" stroke-width="3" />
    <text x="1267" y="1733" class="store-id">D7</text>
    <text x="1312" y="1733" class="store-name">inventory</text>
  </g>

  <!-- ================= DATA FLOW ARROWS ================= -->

  <!-- --- 1.0 Auth --- -->
  <path d="M 205 85 L 550 85" class="flow-line" />
  <text x="285" y="75" class="flow-text">Login Credentials &amp; Role</text>
  
  <path d="M 560 135 L 215 135" class="flow-line" />
  <text x="285" y="155" class="flow-text">Auth Token &amp; User Profile</text>
  
  <line x1="960" y1="90" x2="1230" y2="90" class="flow-line" />
  <text x="980" y="80" class="flow-text">Query User Credentials</text>
  <line x1="1240" y1="135" x2="970" y2="135" class="flow-line" />
  <text x="980" y="150" class="flow-text">User Record &amp; Roles</text>

  <!-- --- 2.0 Attendance --- -->
  <path d="M 205 355 L 550 355" class="flow-line" />
  <text x="285" y="345" class="flow-text">Scan Gym Entrance QR Code</text>
  
  <path d="M 560 405 L 215 405" class="flow-line" />
  <text x="285" y="425" class="flow-text">Attendance Confirmation Notice</text>
  
  <!-- Admin/Staff -> 2.0 (Attendance Monitor) via bus at x=220 -->
  <path d="M 205 1420 L 220 1420 L 220 440 L 550 440" class="flow-line" />
  <text x="285" y="455" class="flow-text">Live Roster Attendance Verification</text>
  
  <line x1="960" y1="360" x2="1230" y2="360" class="flow-line" />
  <text x="980" y="350" class="flow-text">Write Check-In Timestamp</text>
  <line x1="1240" y1="405" x2="970" y2="405" class="flow-line" />
  <text x="980" y="425" class="flow-text">Validate Membership Validity</text>

  <!-- --- 3.0 Equipment QR Scanning --- -->
  <path d="M 205 200 L 235 200 L 235 625 L 550 625" class="flow-line" />
  <text x="285" y="615" class="flow-text">Scan Equipment QR Code</text>
  
  <path d="M 560 675 L 250 675 L 250 235 L 215 235" class="flow-line" />
  <text x="285" y="695" class="flow-text">Exercise Video Link &amp; Muscle Guide</text>
  
  <line x1="960" y1="630" x2="1230" y2="630" class="flow-line" />
  <text x="980" y="620" class="flow-text">Query Equipment Identifier</text>
  <line x1="1240" y1="675" x2="970" y2="675" class="flow-line" />
  <text x="980" y="695" class="flow-text">Exercise Video Link &amp; Safety Info</text>

  <!-- --- 4.0 Workout Split Routine & PR --- -->
  <path d="M 205 170 L 265 170 L 265 895 L 550 895" class="flow-line" />
  <text x="285" y="885" class="flow-text">Log Lifting PR &amp; Workout Split Routine</text>
  
  <path d="M 560 945 L 250 945 L 250 110 L 215 110" class="flow-line" />
  <text x="285" y="965" class="flow-text">Historical Strength Progression Charts</text>
  
  <line x1="960" y1="900" x2="1230" y2="900" class="flow-line" />
  <text x="980" y="890" class="flow-text">Save Daily Sets, Reps &amp; Weights</text>
  <line x1="1240" y1="945" x2="970" y2="945" class="flow-line" />
  <text x="980" y="965" class="flow-text">Fetch Personal Record (PR) History</text>

  <!-- --- 5.0 Consultation & Workout Proposals --- -->
  <path d="M 205 980 L 235 980 L 235 1165 L 550 1165" class="flow-line" />
  <text x="285" y="1155" class="flow-text">Submit Tailored Workout Proposal</text>
  
  <path d="M 560 1215 L 250 1215 L 250 1040 L 215 1040" class="flow-line" />
  <text x="285" y="1235" class="flow-text">Proposal Acceptance Status &amp; Trainee Chat</text>
  
  <line x1="960" y1="1170" x2="1230" y2="1170" class="flow-line" />
  <text x="980" y="1160" class="flow-text">Save Proposal &amp; Consultation Message</text>
  <line x1="1240" y1="1215" x2="970" y2="1215" class="flow-line" />
  <text x="980" y="1235" class="flow-text">Retrieve Consultation History</text>

  <!-- --- 6.0 Store Sales & Orders --- -->
  <path d="M 205 460 L 220 460 L 220 1435 L 550 1435" class="flow-line" />
  <text x="285" y="1425" class="flow-text">Order Products &amp; Submit GCash Ref</text>
  
  <path d="M 205 1485 L 550 1485" class="flow-line" />
  <text x="285" y="1475" class="flow-text">Counter Cash Payment &amp; Verification</text>
  
  <line x1="960" y1="1440" x2="1230" y2="1440" class="flow-line" />
  <text x="980" y="1430" class="flow-text">Write Order &amp; Payment Record</text>
  <line x1="1240" y1="1485" x2="970" y2="1485" class="flow-line" />
  <text x="980" y="1505" class="flow-text">Order Verification Status</text>
  
  <path d="M 960 1510 L 1020 1510 L 1020 1715 L 1230 1715" class="flow-line" />
  <text x="1035" y="1610" class="flow-text">Auto-Deduct Product Stock</text>

  <!-- --- 7.0 Store Inventory & Report Generation --- -->
  <line x1="205" y1="1710" x2="550" y2="1710" class="flow-line" />
  <text x="285" y="1700" class="flow-text">Product Stock Updates / Report Date Range</text>
  
  <line x1="560" y1="1760" x2="215" y2="1760" class="flow-line" />
  <text x="285" y="1780" class="flow-text">Export Formatted PDF / Excel Reports</text>
  
  <line x1="960" y1="1750" x2="1230" y2="1750" class="flow-line" />
  <text x="980" y="1740" class="flow-text">Update Product Catalog</text>

</svg>
</div>

</body>
</html>
