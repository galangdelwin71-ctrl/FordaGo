<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Flow Diagram Level 1 (DFD Level 1) of FordaGO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    font-family: 'Times New Roman', Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    width: 1440px;
    height: 1880px;
    margin: 0 auto;
  }
  .diagram-container {
    width: 1390px;
    height: 1830px;
    border: 4px solid #000000;
    background: #ffffff;
    padding: 10px;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Entity Boxes */
  .entity-box {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 4;
  }
  .entity-title {
    font-family: 'Times New Roman', Times, serif;
    font-size: 32px;
    font-weight: 900;
    text-anchor: middle;
    fill: #000000;
    letter-spacing: 0.5px;
  }
  .entity-sub {
    font-family: 'Times New Roman', Times, serif;
    font-size: 23px;
    font-weight: 700;
    text-anchor: middle;
    fill: #000000;
    font-style: italic;
  }
  /* Process Boxes (Rounded with header divider) */
  .process-box {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 3.5;
  }
  .process-header-line {
    stroke: #000000;
    stroke-width: 3;
  }
  .process-num {
    font-family: 'Times New Roman', Times, serif;
    font-size: 30px;
    font-weight: 900;
    text-anchor: middle;
    fill: #000000;
  }
  .process-name {
    font-family: 'Times New Roman', Times, serif;
    font-size: 25px;
    font-weight: 800;
    text-anchor: middle;
    fill: #000000;
  }
  /* Data Store */
  .store-line {
    stroke: #000000;
    stroke-width: 3.5;
    fill: none;
  }
  .store-fill {
    fill: #ffffff;
    stroke: none;
  }
  .store-id {
    font-family: 'Times New Roman', Times, serif;
    font-size: 30px;
    font-weight: 900;
    text-anchor: middle;
    dominant-baseline: central;
    fill: #000000;
  }
  .store-name {
    font-family: 'Times New Roman', Times, serif;
    font-size: 26px;
    font-weight: 900;
    dominant-baseline: central;
    fill: #000000;
  }
  /* Flow Lines */
  .flow-line {
    stroke: #000000;
    stroke-width: 3;
    fill: none;
    marker-end: url(#arrow);
  }
  .flow-text {
    font-family: 'Times New Roman', Times, serif;
    font-size: 20px;
    font-weight: 800;
    fill: #000000;
    paint-order: stroke fill;
    stroke: #ffffff;
    stroke-width: 5px;
    stroke-linejoin: round;
  }
</style>
</head>
<body>

<div class="diagram-container">
<svg viewBox="0 0 1370 1810" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- ================= EXTERNAL ENTITIES (LEFT COLUMN, x=25..245) ================= -->
  
  <!-- Entity: Gym Member (x=25, y=50, w=220, h=320) -->
  <rect x="25" y="50" width="220" height="320" class="entity-box" />
  <text x="135" y="170" class="entity-title">GYM</text>
  <text x="135" y="210" class="entity-title">MEMBER</text>
  <text x="135" y="255" class="entity-sub">(Mobile Client App)</text>

  <!-- Entity: Gym Coach (x=25, y=780, w=220, h=260) -->
  <rect x="25" y="780" width="220" height="260" class="entity-box" />
  <text x="135" y="880" class="entity-title">GYM</text>
  <text x="135" y="920" class="entity-title">COACH</text>
  <text x="135" y="965" class="entity-sub">(Trainer Web Portal)</text>

  <!-- Entity: Gym Admin / Staff (x=25, y=1340, w=220, h=330) -->
  <rect x="25" y="1340" width="220" height="330" class="entity-box" />
  <text x="135" y="1460" class="entity-title">GYM ADMIN /</text>
  <text x="135" y="1500" class="entity-title">STAFF</text>
  <text x="135" y="1545" class="entity-sub">(Admin Desk / POS)</text>

  <!-- ================= PROCESSES (CENTER COLUMN, x=530..950, w=420, h=130) ================= -->

  <!-- Process 1.0 -->
  <g id="p1">
    <rect x="530" y="40" width="420" height="130" rx="18" class="process-box" />
    <line x1="530" y1="80" x2="950" y2="80" class="process-header-line" />
    <text x="740" y="68" class="process-num">1.0</text>
    <text x="740" y="112" class="process-name">User Authentication</text>
    <text x="740" y="145" class="process-name">&amp; Profile Management</text>
  </g>

  <!-- Process 2.0 -->
  <g id="p2">
    <rect x="530" y="290" width="420" height="130" rx="18" class="process-box" />
    <line x1="530" y1="330" x2="950" y2="330" class="process-header-line" />
    <text x="740" y="318" class="process-num">2.0</text>
    <text x="740" y="362" class="process-name">QR Attendance Verification</text>
    <text x="740" y="395" class="process-name">&amp; Check-In Processing</text>
  </g>

  <!-- Process 3.0 -->
  <g id="p3">
    <rect x="530" y="540" width="420" height="130" rx="18" class="process-box" />
    <line x1="530" y1="580" x2="950" y2="580" class="process-header-line" />
    <text x="740" y="568" class="process-num">3.0</text>
    <text x="740" y="612" class="process-name">Equipment Optical QR Scanning</text>
    <text x="740" y="645" class="process-name">&amp; Instructional Guidance</text>
  </g>

  <!-- Process 4.0 -->
  <g id="p4">
    <rect x="530" y="790" width="420" height="130" rx="18" class="process-box" />
    <line x1="530" y1="830" x2="950" y2="830" class="process-header-line" />
    <text x="740" y="818" class="process-num">4.0</text>
    <text x="740" y="862" class="process-name">Workout Split Routine</text>
    <text x="740" y="895" class="process-name">&amp; PR Metric Logging</text>
  </g>

  <!-- Process 5.0 -->
  <g id="p5">
    <rect x="530" y="1040" width="420" height="130" rx="18" class="process-box" />
    <line x1="530" y1="1080" x2="950" y2="1080" class="process-header-line" />
    <text x="740" y="1068" class="process-num">5.0</text>
    <text x="740" y="1112" class="process-name">Real-Time Consultation &amp;</text>
    <text x="740" y="1145" class="process-name">Workout Plan Proposals</text>
  </g>

  <!-- Process 6.0 -->
  <g id="p6">
    <rect x="530" y="1290" width="420" height="130" rx="18" class="process-box" />
    <line x1="530" y1="1330" x2="950" y2="1330" class="process-header-line" />
    <text x="740" y="1318" class="process-num">6.0</text>
    <text x="740" y="1362" class="process-name">Supplement Shop POS</text>
    <text x="740" y="1395" class="process-name">&amp; Order Processing</text>
  </g>

  <!-- Process 7.0 -->
  <g id="p7">
    <rect x="530" y="1540" width="420" height="130" rx="18" class="process-box" />
    <line x1="530" y1="1580" x2="950" y2="1580" class="process-header-line" />
    <text x="740" y="1568" class="process-num">7.0</text>
    <text x="740" y="1612" class="process-name">Inventory Stock Management</text>
    <text x="740" y="1645" class="process-name">&amp; Dynamic Report Generation</text>
  </g>

  <!-- ================= DATA STORES (RIGHT COLUMN, x=1090..1350, w=260, h=90) ================= -->

  <!-- D1: users -->
  <g id="d1">
    <rect x="1090" y="60" width="260" height="90" class="store-fill" />
    <path d="M 1350 60 L 1090 60 L 1090 150 L 1350 150" class="store-line" />
    <line x1="1155" y1="60" x2="1155" y2="150" stroke="#000000" stroke-width="3" />
    <text x="1122" y="105" class="store-id">D1</text>
    <text x="1175" y="105" class="store-name">users</text>
  </g>

  <!-- D2: attendance -->
  <g id="d2">
    <rect x="1090" y="310" width="260" height="90" class="store-fill" />
    <path d="M 1350 310 L 1090 310 L 1090 400 L 1350 400" class="store-line" />
    <line x1="1155" y1="310" x2="1155" y2="400" stroke="#000000" stroke-width="3" />
    <text x="1122" y="355" class="store-id">D2</text>
    <text x="1175" y="355" class="store-name">attendance</text>
  </g>

  <!-- D3: equipment -->
  <g id="d3">
    <rect x="1090" y="560" width="260" height="90" class="store-fill" />
    <path d="M 1350 560 L 1090 560 L 1090 650 L 1350 650" class="store-line" />
    <line x1="1155" y1="560" x2="1155" y2="650" stroke="#000000" stroke-width="3" />
    <text x="1122" y="605" class="store-id">D3</text>
    <text x="1175" y="605" class="store-name">equipment</text>
  </g>

  <!-- D4: workout_sessions -->
  <g id="d4">
    <rect x="1090" y="810" width="260" height="90" class="store-fill" />
    <path d="M 1350 810 L 1090 810 L 1090 900 L 1350 900" class="store-line" />
    <line x1="1155" y1="810" x2="1155" y2="900" stroke="#000000" stroke-width="3" />
    <text x="1122" y="855" class="store-id">D4</text>
    <text x="1175" y="855" class="store-name">workout_sessions</text>
  </g>

  <!-- D5: workout_proposals -->
  <g id="d5">
    <rect x="1090" y="1060" width="260" height="90" class="store-fill" />
    <path d="M 1350 1060 L 1090 1060 L 1090 1150 L 1350 1150" class="store-line" />
    <line x1="1155" y1="1060" x2="1155" y2="1150" stroke="#000000" stroke-width="3" />
    <text x="1122" y="1105" class="store-id">D5</text>
    <text x="1175" y="1105" class="store-name">workout_proposals</text>
  </g>

  <!-- D6: orders -->
  <g id="d6">
    <rect x="1090" y="1310" width="260" height="90" class="store-fill" />
    <path d="M 1350 1310 L 1090 1310 L 1090 1400 L 1350 1400" class="store-line" />
    <line x1="1155" y1="1310" x2="1155" y2="1400" stroke="#000000" stroke-width="3" />
    <text x="1122" y="1355" class="store-id">D6</text>
    <text x="1175" y="1355" class="store-name">orders</text>
  </g>

  <!-- D7: products -->
  <g id="d7">
    <rect x="1090" y="1560" width="260" height="90" class="store-fill" />
    <path d="M 1350 1560 L 1090 1560 L 1090 1650 L 1350 1650" class="store-line" />
    <line x1="1155" y1="1560" x2="1155" y2="1650" stroke="#000000" stroke-width="3" />
    <text x="1122" y="1605" class="store-id">D7</text>
    <text x="1175" y="1605" class="store-name">products</text>
  </g>

  <!-- ================= DATA FLOW LINES ================= -->

  <!-- --- 1.0 User Authentication --- -->
  <path d="M 245 80 L 520 80" class="flow-line" />
  <text x="270" y="70" class="flow-text">Login Credentials / Registration Data</text>
  
  <path d="M 520 120 L 245 120" class="flow-line" />
  <text x="270" y="140" class="flow-text">Session Token &amp; Authenticated Profile</text>
  
  <line x1="950" y1="85" x2="1080" y2="85" class="flow-line" />
  <text x="965" y="75" class="flow-text">Verify Credentials</text>
  <line x1="1080" y1="125" x2="960" y2="125" class="flow-line" />
  <text x="965" y="145" class="flow-text">User Record &amp; Roles</text>

  <!-- --- 2.0 Attendance --- -->
  <path d="M 245 325 L 520 325" class="flow-line" />
  <text x="270" y="315" class="flow-text">Present Dynamic QR Pass</text>
  
  <path d="M 520 375 L 245 375" class="flow-line" />
  <text x="270" y="395" class="flow-text">Attendance Confirmation Notice</text>
  
  <!-- Admin -> 2.0 -->
  <path d="M 245 1370 L 320 1370 L 320 410 L 520 410" class="flow-line" />
  <text x="330" y="425" class="flow-text">Front-Desk Scanner Verification</text>
  
  <line x1="950" y1="335" x2="1080" y2="335" class="flow-line" />
  <text x="965" y="325" class="flow-text">Write Check-In Timestamp</text>
  <line x1="1080" y1="375" x2="960" y2="375" class="flow-line" />
  <text x="965" y="395" class="flow-text">Validate Membership Validity</text>

  <!-- --- 3.0 Equipment QR --- -->
  <path d="M 245 220 L 370 220 L 370 575 L 520 575" class="flow-line" />
  <text x="380" y="565" class="flow-text">Scan Equipment Optical QR Placard</text>
  
  <path d="M 530 625 L 390 625 L 390 260 L 255 260" class="flow-line" />
  <text x="400" y="640" class="flow-text">Instructional Movement Tutorial &amp; Muscles</text>
  
  <line x1="950" y1="585" x2="1080" y2="585" class="flow-line" />
  <text x="965" y="575" class="flow-text">Query Equipment Identifier</text>
  <line x1="1080" y1="625" x2="960" y2="625" class="flow-line" />
  <text x="965" y="645" class="flow-text">Exercise Video Link &amp; Safety Info</text>

  <!-- --- 4.0 Workout / PR Tracking --- -->
  <path d="M 245 180 L 440 180 L 440 825 L 520 825" class="flow-line" />
  <text x="270" y="815" class="flow-text">Log Lifting PR &amp; Workout Split Routine</text>
  
  <path d="M 530 875 L 460 875 L 460 160 L 255 160" class="flow-line" />
  <text x="270" y="895" class="flow-text">Historical Strength Progression Charts</text>
  
  <line x1="950" y1="835" x2="1080" y2="835" class="flow-line" />
  <text x="965" y="825" class="flow-text">Save Daily Sets, Reps &amp; Weights</text>
  <line x1="1080" y1="875" x2="960" y2="875" class="flow-line" />
  <text x="965" y="895" class="flow-text">Fetch Personal Record (PR) History</text>

  <!-- --- 5.0 Coaching & Proposals --- -->
  <path d="M 245 820 L 520 1075" class="flow-line" />
  <text x="270" y="1035" class="flow-text">Submit Tailored Workout Proposal</text>
  
  <path d="M 530 1125 L 380 1125 L 380 920 L 255 920" class="flow-line" />
  <text x="270" y="1115" class="flow-text">Proposal Acceptance Status &amp; Chat Feed</text>
  
  <line x1="950" y1="1085" x2="1080" y2="1085" class="flow-line" />
  <text x="965" y="1075" class="flow-text">Save Proposal &amp; Consultation Message</text>
  <line x1="1080" y1="1125" x2="960" y2="1125" class="flow-line" />
  <text x="965" y="1145" class="flow-text">Retrieve Consultation History</text>

  <!-- --- 6.0 Shop POS & Orders --- -->
  <path d="M 245 100 L 480 100 L 480 1325 L 520 1325" class="flow-line" />
  <text x="270" y="1315" class="flow-text">Cart Checkout &amp; Multi-Channel Payment (GCash/Maya/Card/Cash)</text>
  
  <path d="M 245 1420 L 520 1375" class="flow-line" />
  <text x="270" y="1395" class="flow-text">Counter POS Transaction / Payment Verification</text>
  
  <line x1="950" y1="1335" x2="1080" y2="1335" class="flow-line" />
  <text x="965" y="1325" class="flow-text">Write Order &amp; Payment Record</text>
  <line x1="1080" y1="1375" x2="960" y2="1375" class="flow-line" />
  <text x="965" y="1395" class="flow-text">Order Verification Status</text>
  
  <!-- 6.0 -> D7 (stock auto-deduct) -->
  <path d="M 950 1400 L 1050 1400 L 1050 1590 L 1080 1590" class="flow-line" />
  <text x="965" y="1425" class="flow-text">Auto-Deduct Product Stock</text>

  <!-- --- 7.0 Inventory & Report Generation --- -->
  <line x1="245" y1="1575" x2="520" y2="1575" class="flow-line" />
  <text x="270" y="1565" class="flow-text">Product Stock Updates / Report Range</text>
  
  <line x1="520" y1="1625" x2="255" y2="1625" class="flow-line" />
  <text x="270" y="1645" class="flow-text">Export Formatted PDF / Excel Analytics</text>
  
  <line x1="950" y1="1615" x2="1080" y2="1615" class="flow-line" />
  <text x="965" y="1605" class="flow-text">Update Product Catalog</text>

</svg>
</div>

</body>
</html>
