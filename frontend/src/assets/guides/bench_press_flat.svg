<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" rx="24" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" stroke-dasharray="4 4" opacity="0.4" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="760" y1="0" x2="760" y2="480" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="420" x2="800" y2="420" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 24)">
    <rect width="720" height="44" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="22" r="7" fill="#ef4444" />
    <text x="42" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">BARBELL FLAT BENCH PRESS</text>
    <text x="700" y="27" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Target: Pectoralis Major & Triceps</text>
  </g>

  <!-- LEFT PANEL: STARTING POSITION -->
  <g transform="translate(40, 84)">
    <rect width="345" height="340" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="18" y="16" width="130" height="28" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="32" cy="30" r="5" fill="#38bdf8" />
    <text x="46" y="35" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1. START FORM</text>
    
    <!-- Floor Platform -->
    <line x1="30" y1="290" x2="315" y2="290" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="172" cy="290" rx="120" ry="14" fill="#38bdf8" opacity="0.08" />

    <!-- Left Graphic Illustration -->
    <g transform="translate(40, 20)">
      
      <!-- Bench Frame -->
      <rect x="40" y="195" width="200" height="16" fill="#475569" rx="4" />
      <rect x="60" y="211" width="14" height="60" fill="#334155" />
      <rect x="210" y="211" width="14" height="60" fill="#334155" />
      <!-- Upright Rack -->
      <rect x="50" y="110" width="12" height="95" fill="#64748b" />
      
      <!-- Athlete Lie Down -->
      <circle cx="75" cy="180" r="16" fill="#fbcfe8" />
      <rect x="90" y="180" width="80" height="24" fill="#3b82f6" rx="6" />
      <!-- Legs bent to floor -->
      <path d="M 170 195 L 195 215 L 195 270" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none" />
      <!-- Bar on Chest (Lowered) -->
      <path d="M 115 180 L 125 155 L 125 170" stroke="#f472b6" stroke-width="8" stroke-linecap="round" fill="none" />
      <line x1="90" y1="170" x2="160" y2="170" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
      <circle cx="90" cy="170" r="14" fill="#ef4444" />
      <circle cx="160" cy="170" r="14" fill="#ef4444" />
    
    </g>

    <!-- Pose Label -->
    <text x="172" y="322" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Lower bar smoothly to mid-chest</text>
  </g>

  <!-- CENTER MOTION ARROW -->
  <g transform="translate(388, 240)">
    <circle cx="12" cy="12" r="22" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 4 12 L 18 12 M 13 6 L 19 12 L 13 18" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- RIGHT PANEL: FINISHING POSITION -->
  <g transform="translate(415, 84)">
    <rect width="345" height="340" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="18" y="16" width="136" height="28" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="32" cy="30" r="5" fill="#f59e0b" />
    <text x="46" y="35" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2. FINISH DRIVE</text>
    
    <!-- Floor Platform -->
    <line x1="30" y1="290" x2="315" y2="290" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="172" cy="290" rx="120" ry="14" fill="#f59e0b" opacity="0.1" />

    <!-- Right Graphic Illustration -->
    <g transform="translate(40, 20)">
      
      <!-- Bench Frame -->
      <rect x="40" y="195" width="200" height="16" fill="#475569" rx="4" />
      <rect x="60" y="211" width="14" height="60" fill="#334155" />
      <rect x="210" y="211" width="14" height="60" fill="#334155" />
      <!-- Upright Rack -->
      <rect x="50" y="110" width="12" height="95" fill="#64748b" />
      
      <!-- Athlete Lie Down -->
      <circle cx="75" cy="180" r="16" fill="#fbcfe8" />
      <rect x="90" y="180" width="80" height="24" fill="#3b82f6" rx="6" />
      <!-- Legs bent to floor -->
      <path d="M 170 195 L 195 215 L 195 270" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none" />
      <!-- Arms Extended Up -->
      <path d="M 115 180 L 120 135 L 125 120" stroke="#4ade80" stroke-width="8" stroke-linecap="round" fill="none" />
      <line x1="90" y1="120" x2="160" y2="120" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
      <circle cx="90" cy="120" r="14" fill="#22c55e" />
      <circle cx="160" cy="120" r="14" fill="#22c55e" />
      <!-- Upward motion arrows -->
      <path d="M 125 155 L 125 130 M 120 138 L 125 128 L 130 138" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    </g>

    <!-- Pose Label -->
    <text x="172" y="322" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Drive bar up & lock out over shoulders</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(40, 442)">
    <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">AFFORDA Gym Training Guide · Keep core tight &amp; breathe steadily</text>
    <text x="720" y="16" text-anchor="end" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">3-4 Sets · 8-12 Reps</text>
  </g>
</svg>