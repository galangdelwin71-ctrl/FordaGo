<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" rx="24" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" stroke-dasharray="4 4" opacity="0.4" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="760" y1="0" x2="760" y2="480" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="420" x2="800" y2="420" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 24)">
    <rect width="720" height="44" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="22" r="7" fill="#f97316" />
    <text x="42" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">45-DEGREE LEG PRESS</text>
    <text x="700" y="27" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Target: Quadriceps, Hamstrings & Glutes</text>
  </g>

  <!-- LEFT PANEL: STARTING POSITION -->
  <g transform="translate(40, 84)">
    <rect width="345" height="340" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="18" y="16" width="130" height="28" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="32" cy="30" r="5" fill="#38bdf8" />
    <text x="46" y="35" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1. START FORM</text>
    
    <!-- Floor Platform -->
    <line x1="30" y1="290" x2="315" y2="290" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="172" cy="290" rx="120" ry="14" fill="#38bdf8" opacity="0.08" />

    <!-- Left Graphic Illustration -->
    <g transform="translate(40, 20)">
      
      <!-- Sled Guide Rails at 45 deg -->
      <line x1="40" y1="260" x2="220" y2="80" stroke="#64748b" stroke-width="12" stroke-linecap="round" />
      <!-- Footplate -->
      <rect x="180" y="60" width="30" height="45" fill="#334155" transform="rotate(-45 195 82)" rx="3" />
      <!-- Incline Seat -->
      <rect x="50" y="200" width="45" height="14" fill="#1e293b" transform="rotate(-45 72 207)" rx="3" />
      
      <!-- Athlete In Seat (Knees Bent) -->
      <circle cx="45" cy="190" r="14" fill="#fbcfe8" />
      <path d="M 55 200 L 90 235" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" />
      <!-- Legs bent 90 -->
      <path d="M 90 235 L 125 175 L 175 105" stroke="#f97316" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    </g>

    <!-- Pose Label -->
    <text x="172" y="322" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Knees bent to 90°, feet on platform</text>
  </g>

  <!-- CENTER MOTION ARROW -->
  <g transform="translate(388, 240)">
    <circle cx="12" cy="12" r="22" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 4 12 L 18 12 M 13 6 L 19 12 L 13 18" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- RIGHT PANEL: FINISHING POSITION -->
  <g transform="translate(415, 84)">
    <rect width="345" height="340" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="18" y="16" width="136" height="28" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="32" cy="30" r="5" fill="#06b6d4" />
    <text x="46" y="35" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2. FINISH DRIVE</text>
    
    <!-- Floor Platform -->
    <line x1="30" y1="290" x2="315" y2="290" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="172" cy="290" rx="120" ry="14" fill="#06b6d4" opacity="0.1" />

    <!-- Right Graphic Illustration -->
    <g transform="translate(40, 20)">
      
      <!-- Sled Guide Rails at 45 deg -->
      <line x1="40" y1="260" x2="220" y2="80" stroke="#64748b" stroke-width="12" stroke-linecap="round" />
      <!-- Footplate Extended -->
      <rect x="210" y="30" width="30" height="45" fill="#334155" transform="rotate(-45 225 52)" rx="3" />
      <!-- Incline Seat -->
      <rect x="50" y="200" width="45" height="14" fill="#1e293b" transform="rotate(-45 72 207)" rx="3" />
      
      <!-- Athlete Legs Extended -->
      <circle cx="45" cy="190" r="14" fill="#fbcfe8" />
      <path d="M 55 200 L 90 235" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" />
      <!-- Legs straight without knee hyperextension -->
      <path d="M 90 235 L 155 170 L 210 75" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Quad Drive Glow -->
      <ellipse cx="140" cy="180" rx="14" ry="8" fill="#06b6d4" opacity="0.6" transform="rotate(-45 140 180)" />
    
    </g>

    <!-- Pose Label -->
    <text x="172" y="322" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Drive through heels, press sled upwards</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(40, 442)">
    <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">AFFORDA Gym Training Guide · Keep core tight &amp; breathe steadily</text>
    <text x="720" y="16" text-anchor="end" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">3-4 Sets · 8-12 Reps</text>
  </g>
</svg>