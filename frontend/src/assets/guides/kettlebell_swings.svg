<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" rx="24" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" stroke-dasharray="4 4" opacity="0.4" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="760" y1="0" x2="760" y2="480" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="420" x2="800" y2="420" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 24)">
    <rect width="720" height="44" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="22" r="7" fill="#eab308" />
    <text x="42" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">KETTLEBELL RUSSIAN SWING</text>
    <text x="700" y="27" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Target: Posterior Chain, Glutes & Core</text>
  </g>

  <!-- LEFT PANEL: STARTING POSITION -->
  <g transform="translate(40, 84)">
    <rect width="345" height="340" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="18" y="16" width="130" height="28" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="32" cy="30" r="5" fill="#38bdf8" />
    <text x="46" y="35" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1. START FORM</text>
    
    <!-- Floor Platform -->
    <line x1="30" y1="290" x2="315" y2="290" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="172" cy="290" rx="120" ry="14" fill="#38bdf8" opacity="0.08" />

    <!-- Left Graphic Illustration -->
    <g transform="translate(40, 20)">
      
      <!-- Athlete Hip Hinge (Start) -->
      <circle cx="105" cy="130" r="16" fill="#fbcfe8" />
      <!-- Torso tilted 45 deg -->
      <path d="M 115 145 L 160 195" stroke="#3b82f6" stroke-width="18" stroke-linecap="round" />
      <!-- Legs slight knee bend -->
      <path d="M 160 195 L 180 230 L 175 270" stroke="#1e293b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Arms hanging down with KB -->
      <path d="M 120 155 L 145 220" stroke="#f472b6" stroke-width="7" stroke-linecap="round" />
      <!-- Kettlebell between legs -->
      <circle cx="150" cy="235" r="14" fill="#475569" />
      <path d="M 143 222 A 6 6 0 0 1 157 222" stroke="#94a3b8" stroke-width="3" fill="none" />
    
    </g>

    <!-- Pose Label -->
    <text x="172" y="322" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Hinge hips back, bell between thighs</text>
  </g>

  <!-- CENTER MOTION ARROW -->
  <g transform="translate(388, 240)">
    <circle cx="12" cy="12" r="22" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 4 12 L 18 12 M 13 6 L 19 12 L 13 18" stroke="#eab308" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- RIGHT PANEL: FINISHING POSITION -->
  <g transform="translate(415, 84)">
    <rect width="345" height="340" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="18" y="16" width="136" height="28" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="32" cy="30" r="5" fill="#ef4444" />
    <text x="46" y="35" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2. FINISH DRIVE</text>
    
    <!-- Floor Platform -->
    <line x1="30" y1="290" x2="315" y2="290" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="172" cy="290" rx="120" ry="14" fill="#ef4444" opacity="0.1" />

    <!-- Right Graphic Illustration -->
    <g transform="translate(40, 20)">
      
      <!-- Athlete Standing Tall (Finish) -->
      <circle cx="150" cy="85" r="16" fill="#fbcfe8" />
      <!-- Torso Vertical -->
      <path d="M 150 105 L 150 185" stroke="#3b82f6" stroke-width="18" stroke-linecap="round" />
      <!-- Legs Straight -->
      <path d="M 145 185 L 140 270 M 155 185 L 160 270" stroke="#1e293b" stroke-width="13" stroke-linecap="round" />
      <!-- Arms Extended Forward -->
      <path d="M 150 115 L 90 120" stroke="#eab308" stroke-width="7" stroke-linecap="round" />
      <!-- Kettlebell Floating at Chest Height -->
      <circle cx="75" cy="120" r="15" fill="#ef4444" />
      <path d="M 85 112 A 6 6 0 0 1 85 128" stroke="#fcd34d" stroke-width="3" fill="none" />
      <!-- Glute & Hip Snap Indicator -->
      <path d="M 150 185 L 135 185 M 140 180 L 133 185 L 140 190" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    </g>

    <!-- Pose Label -->
    <text x="172" y="322" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Snap hips forward, drive bell to chest level</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(40, 442)">
    <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">AFFORDA Gym Training Guide · Keep core tight &amp; breathe steadily</text>
    <text x="720" y="16" text-anchor="end" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">3-4 Sets · 8-12 Reps</text>
  </g>
</svg>