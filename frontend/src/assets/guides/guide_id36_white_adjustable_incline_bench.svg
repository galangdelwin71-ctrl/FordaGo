<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="benchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#benchBg)" rx="20" />

  <!-- Top Header Banner -->
  <rect x="40" y="24" width="1120" height="60" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="65" y="61" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">ADJUSTABLE INCLINE WEIGHT BENCH (MULTI-ANGLE GUIDE)</text>
  <rect x="940" y="38" width="200" height="32" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
  <text x="1040" y="59" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">EQUIPMENT ID: 36</text>

  <!-- Panel 1: Flat Position (0°) -->
  <g transform="translate(40, 105)">
    <rect width="350" height="440" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Header Badge -->
    <rect x="20" y="20" width="310" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="175" y="44" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">SETTING 1: FLAT POSITION (0°)</text>

    <!-- Bench Illustration: 0-Degree Flat -->
    <!-- Floor Line -->
    <line x1="30" y1="300" x2="320" y2="300" stroke="#475569" stroke-width="2.5" stroke-dasharray="6,6" />
    
    <!-- Bench Steel Base Frame -->
    <rect x="60" y="280" width="230" height="14" rx="4" fill="#64748b" />
    <rect x="50" y="270" width="20" height="30" rx="4" fill="#475569" />
    <rect x="270" y="270" width="20" height="30" rx="4" fill="#475569" />
    <line x1="90" y1="280" x2="90" y2="215" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
    <line x1="250" y1="280" x2="250" y2="215" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
    <line x1="80" y1="215" x2="260" y2="215" stroke="#64748b" stroke-width="10" />

    <!-- Flat Backrest & Seat Pad -->
    <rect x="60" y="195" width="65" height="18" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <rect x="135" y="195" width="145" height="18" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Adjustment Bracket -->
    <line x1="180" y1="215" x2="210" y2="215" stroke="#f59e0b" stroke-width="5" />

    <!-- Angle Indicator -->
    <circle cx="135" cy="204" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="135" y="209" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">0°</text>

    <!-- Details Box -->
    <rect x="20" y="325" width="310" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="350" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Primary Exercises:</text>
    <text x="35" y="372" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Flat Dumbbell / Barbell Chest Press</text>
    <text x="35" y="392" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Single-Arm Dumbbell Row (Back)</text>
    <text x="35" y="410" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">• Flat Dumbbell Flyes &amp; Skull Crushers</text>
  </g>

  <!-- Panel 2: Incline Position (30°- 45°) -->
  <g transform="translate(425, 105)">
    <rect width="350" height="440" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2" />
    <!-- Header Badge -->
    <rect x="20" y="20" width="310" height="36" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="175" y="44" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">SETTING 2: INCLINE (30° - 45°)</text>

    <!-- Bench Illustration: 45-Degree Incline -->
    <!-- Floor Line -->
    <line x1="30" y1="300" x2="320" y2="300" stroke="#475569" stroke-width="2.5" stroke-dasharray="6,6" />
    
    <!-- Bench Steel Base Frame -->
    <rect x="60" y="280" width="230" height="14" rx="4" fill="#64748b" />
    <rect x="50" y="270" width="20" height="30" rx="4" fill="#475569" />
    <rect x="270" y="270" width="20" height="30" rx="4" fill="#475569" />
    <line x1="90" y1="280" x2="90" y2="215" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
    <line x1="250" y1="280" x2="250" y2="215" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />

    <!-- Tilted Seat Pad (Angled to prevent slipping) -->
    <g transform="translate(60, 215) rotate(-15)">
      <rect x="0" y="-14" width="65" height="18" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" />
    </g>

    <!-- Angled Incline Backrest Pad (45 degrees) -->
    <g transform="translate(130, 215) rotate(-45)">
      <rect x="0" y="-14" width="155" height="18" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" filter="url(#glow)" />
      <rect x="0" y="-14" width="155" height="18" rx="4" fill="#d97706" stroke="#fbbf24" stroke-width="1.5" />
    </g>

    <!-- Ladder Adjustment Strut -->
    <line x1="175" y1="280" x2="200" y2="160" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />
    <circle cx="200" cy="160" r="5" fill="#f8fafc" />

    <!-- Angle Arc & Label -->
    <path d="M 170 215 A 40 40 0 0 0 160 185" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3,3" />
    <rect x="125" y="145" width="48" height="24" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="149" y="162" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">45°</text>

    <!-- Details Box -->
    <rect x="20" y="325" width="310" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="350" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Primary Exercises:</text>
    <text x="35" y="372" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12">• Incline Dumbbell Chest Press (Upper Chest)</text>
    <text x="35" y="392" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12">• Incline Dumbbell Flyes &amp; Incline Curls</text>
    <text x="35" y="410" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12">• Chest-Supported Dumbbell Rows (Upper Back)</text>
  </g>

  <!-- Panel 3: Upright / Military Position (75°- 85°) -->
  <g transform="translate(810, 105)">
    <rect width="350" height="440" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Header Badge -->
    <rect x="20" y="20" width="310" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="175" y="44" text-anchor="middle" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">SETTING 3: UPRIGHT (75° - 85°)</text>

    <!-- Bench Illustration: 85-Degree Upright -->
    <!-- Floor Line -->
    <line x1="30" y1="300" x2="320" y2="300" stroke="#475569" stroke-width="2.5" stroke-dasharray="6,6" />
    
    <!-- Bench Steel Base Frame -->
    <rect x="60" y="280" width="230" height="14" rx="4" fill="#64748b" />
    <rect x="50" y="270" width="20" height="30" rx="4" fill="#475569" />
    <rect x="270" y="270" width="20" height="30" rx="4" fill="#475569" />
    <line x1="90" y1="280" x2="90" y2="215" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
    <line x1="250" y1="280" x2="250" y2="215" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />

    <!-- Tilted Seat Pad -->
    <g transform="translate(60, 215) rotate(-20)">
      <rect x="0" y="-14" width="65" height="18" rx="4" fill="#10b981" stroke="#34d399" stroke-width="2" />
    </g>

    <!-- Upright Backrest Pad (80-85 degrees) -->
    <g transform="translate(130, 215) rotate(-80)">
      <rect x="0" y="-14" width="155" height="18" rx="4" fill="#10b981" stroke="#34d399" stroke-width="2" />
    </g>

    <!-- High Ladder Adjustment Strut -->
    <line x1="210" y1="280" x2="155" y2="130" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
    <circle cx="155" cy="130" r="5" fill="#f8fafc" />

    <!-- Angle Label -->
    <rect x="155" y="85" width="48" height="24" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="179" y="102" text-anchor="middle" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">80°</text>

    <!-- Details Box -->
    <rect x="20" y="325" width="310" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="350" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Primary Exercises:</text>
    <text x="35" y="372" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">• Seated Dumbbell Shoulder Press</text>
    <text x="35" y="392" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">• Seated Lateral Raises (Deltoids)</text>
    <text x="35" y="410" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">• Seated Bicep Curls / Hammer Curls</text>
  </g>

  <!-- Bottom Quick Safety & Form Bar -->
  <rect x="40" y="565" width="1120" height="85" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="65" y="593" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">⚙️ ADJUSTABLE BENCH OPERATING &amp; SAFETY RULES:</text>
  <text x="65" y="618" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">1. Always ensure the ladder bracket/locking pin is firmly nested into the angle slot before applying weight.</text>
  <text x="65" y="638" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">2. Angle seat upward for incline work to lock hips. Maintain 3-point contact (head, back, hips) with feet flat on the floor.</text>
</svg>
