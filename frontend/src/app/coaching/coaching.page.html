<!-- coaching.page.html -->
<app-header
  subtitle="COACHING"
  [unreadCount]="unreadNotifCount"
  [coachUnreadCount]="coachUnreadCount"
  [profileImage]="profileImage"
  [initials]="initials"
  (coachingClick)="onCoachingClick()"
  (equipmentClick)="goToEquipment()"
  (notifClick)="openNotifPanel()"
  (profileClick)="goToProfile()">
</app-header>

<!-- Coaching screen: in-flow replacement for ion-content below. Only one
     of these two renders at a time -- header and footer stay untouched
     siblings either way. -->
<app-coaching-panel
  *ngIf="coachingPanelOpen"
  [isOpen]="coachingPanelOpen"
  [initialTab]="coachingPanelInitialTab"
  hostPage="coaching"
  (closed)="closeCoachingPanel()"
  (navigated)="onCoachingPanelNavigated()">
</app-coaching-panel>

<ion-content *ngIf="!coachingPanelOpen" [fullscreen]="false" class="fordago-page-content" [scrollY]="true">
  <div class="scroll-wrap">

    <!-- Welcome Section -->
    <div class="page-title-wrap">
      <div class="page-title">Personal Coaching</div>
      <div class="page-sub">Click the coaching icon in the header to explore trainers &amp; connect with coaches</div>
    </div>

    <!-- Quick Action Card -->
    <div class="coaching-cta-card">
      <div class="cta-icon-wrap">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div class="cta-content">
        <h3>Ready to Level Up?</h3>
        <p>Connect with expert trainers and get personalized workout plans tailored to your goals.</p>
        <button type="button" class="cta-button" (click)="openCoachingPanel()">
          <ion-icon name="person-outline"></ion-icon>
          Browse Coaches
        </button>
      </div>
    </div>


    <div class="page-bottom-space" aria-hidden="true"></div>

  </div>
</ion-content>

<!-- Bottom Nav -->
<ion-footer class="fordago-app-footer ion-no-border">
  <nav class="fordago-bottom-nav" aria-label="Main navigation">
    <button type="button" class="fordago-nav-item" (click)="goToDashboard()" aria-label="Home">
      <span class="fordago-nav-icon"><ion-icon name="home-outline"></ion-icon></span>
      <span class="fordago-nav-label">Home</span>
    </button>

    <button type="button" class="fordago-nav-item" (click)="goToSchedule()" aria-label="Schedule">
      <span class="fordago-nav-icon"><ion-icon name="calendar-outline"></ion-icon></span>
      <span class="fordago-nav-label">Schedule</span>
    </button>

    <button type="button" class="fordago-nav-item is-active" aria-label="Coaches">
      <span class="fordago-nav-icon"><ion-icon name="person-outline"></ion-icon></span>
      <span class="fordago-nav-label">Coaching</span>
    </button>

    <button type="button" class="fordago-nav-item" (click)="goToInventory()" aria-label="Shop">
      <span class="fordago-nav-icon"><ion-icon name="bag-handle-outline"></ion-icon></span>
      <span class="fordago-nav-label">Shop</span>
    </button>

    <button type="button" class="fordago-nav-item" (click)="goToProfile()" aria-label="Profile">
      <span class="fordago-nav-icon"><ion-icon name="person-outline"></ion-icon></span>
      <span class="fordago-nav-label">Profile</span>
    </button>
  </nav>
</ion-footer>

<!-- Notifications panel component -->
<app-notification-panel
  [isOpen]="notifPanelOpen"
  (closed)="closeNotifPanel()"
  (unreadCountChange)="onUnreadCountChange($event)">
</app-notification-panel>

<!-- Messenger-style floating chat toast -->
<app-chat-toast></app-chat-toast>
