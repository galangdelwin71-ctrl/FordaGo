<!-- header.component.html -->
<ion-header [translucent]="false" class="fordago-app-header ion-no-border">
  <ion-toolbar class="fordago-toolbar">
    <div slot="start" class="toolbar-brand">
      <span class="brand-mark" aria-hidden="true">
        <img src="/assets/icon/logo.png" class="brand-logo" alt="" />
      </span>
      <span class="toolbar-brand-copy">
        <span class="toolbar-logo">FordaGO</span>
        <span class="toolbar-subtitle" *ngIf="subtitle">{{ subtitle }}</span>
      </span>
    </div>

    <div slot="end" class="header-end" id="tour-header-actions">
      <!-- Page-specific extra actions (e.g. inventory's cart/orders button)
           are projected here, before the shared equipment/notif/profile
           buttons, so every page keeps the same right-to-left order. -->
      <ng-content select="[header-extra]"></ng-content>

      <!-- 1. NOTIFICATION BELL -->
      <button
        type="button"
        id="tour-notif-header-btn"
        class="notif-bell-btn"
        [class.has-unread]="unreadCount > 0"
        (click)="notifClick.emit()"
        aria-label="Open notifications">
        <ion-icon name="notifications-outline" aria-hidden="true"></ion-icon>
        <span class="notif-bell-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>

      <!-- 2. PROFILE AVATAR -->
      <button type="button" id="tour-profile-header-btn" class="profile-button" (click)="profileClick.emit()" aria-label="Open profile">
        <span class="avatar" *ngIf="!profileImage || imageFailed">{{ initials || 'U' }}</span>
        <img *ngIf="profileImage && !imageFailed" [src]="profileImage" alt="" (error)="onImgError()" class="avatar avatar-img" />
      </button>

      <!-- 3. THREE-LINE MENU ICON -->
      <button
        type="button"
        id="tour-menu-header-btn"
        class="menu-header-btn"
        [class.has-unread]="coachUnreadCount > 0"
        aria-label="Open quick menu">
        <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
        <span class="notif-bell-badge" *ngIf="coachUnreadCount > 0">{{ coachUnreadCount > 99 ? '99+' : coachUnreadCount }}</span>
      </button>

      <!-- Popover Menu with Equipment & Coaching -->
      <ion-popover
        #headerMenuPopover
        trigger="tour-menu-header-btn"
        [dismissOnSelect]="true"
        side="bottom"
        alignment="end"
        class="header-menu-popover">
        <ng-template>
          <div class="header-menu-card">
            <div class="header-menu-label">QUICK ACCESS</div>

            <!-- Equipment Option -->
            <button
              type="button"
              id="tour-equip-header-btn"
              class="header-menu-row"
              (click)="onEquipmentClick(headerMenuPopover)"
              aria-label="Open equipment">
              <div class="menu-row-icon-box equip-icon-box">
                <ion-icon name="barbell-outline" aria-hidden="true"></ion-icon>
              </div>
              <div class="menu-row-info">
                <span class="menu-row-title">Equipment</span>
                <span class="menu-row-desc">Guides & gym tracker</span>
              </div>
              <ion-icon name="chevron-forward-outline" class="menu-row-arrow" aria-hidden="true"></ion-icon>
            </button>

            <!-- Coaching Option -->
            <button
              type="button"
              id="tour-coach-header-btn"
              class="header-menu-row"
              [class.has-unread]="coachUnreadCount > 0"
              (click)="onCoachingClick(headerMenuPopover)"
              aria-label="Open coaching">
              <div class="menu-row-icon-box coach-icon-box" [class.has-unread]="coachUnreadCount > 0">
                <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
              </div>
              <div class="menu-row-info">
                <span class="menu-row-title">Coaching</span>
                <span class="menu-row-desc">Online coaches & chat</span>
              </div>
              <span class="notif-bell-badge menu-badge" *ngIf="coachUnreadCount > 0">{{ coachUnreadCount > 99 ? '99+' : coachUnreadCount }}</span>
              <ion-icon *ngIf="coachUnreadCount === 0" name="chevron-forward-outline" class="menu-row-arrow" aria-hidden="true"></ion-icon>
            </button>
          </div>
        </ng-template>
      </ion-popover>
    </div>
  </ion-toolbar>
</ion-header>
