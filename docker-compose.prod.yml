# ==============================================================================
# FordaGO Production Docker / Podman Compose Stack for Cloud VPS
# ==============================================================================

services:
  # ─── 1. MySQL Database ────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: fordago_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fordago}
      MYSQL_USER: ${DB_USERNAME:-fordago_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootSecurePassword123!}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - fordago_net

  # ─── 2. Laravel Backend (PHP-FPM) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fordago_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      RUN_MIGRATIONS: "true"
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - db
    networks:
      - fordago_net

  # ─── 3. Laravel Reverb (WebSockets Server) ─────────────────────────────────
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fordago_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - backend
    networks:
      - fordago_net

  # ─── 4. Laravel Queue Worker ──────────────────────────────────────────────
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fordago_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - backend
    networks:
      - fordago_net

  # ─── 5. Ionic / Angular Frontend SPA ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fordago_frontend
    restart: unless-stopped
    networks:
      - fordago_net

  # ─── 6. Nginx Gateway (Reverse Proxy / Load Balancer) ─────────────────────
  gateway:
    image: nginx:alpine
    container_name: fordago_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - ./backend/storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      - frontend
      - backend
      - reverb
    networks:
      - fordago_net

volumes:
  db_data:
    driver: local

networks:
  fordago_net:
    driver: bridge
